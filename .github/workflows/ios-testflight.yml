# Builds Terris for the App Store and uploads it to TestFlight. Only from
# main: it runs on every push to main that touches the app (a release is the
# owner's go, then main is fast-forwarded to develop), and never from develop
# or by hand. The same setup as the expense tracker's (Budgeer) TestFlight
# workflow.
#
# Signing is Xcode's automatic signing with cloud-managed certificates,
# authorised by an App Store Connect API key (Admin role, team key): no
# certificate or profile is stored anywhere. The archive and the upload are
# Apple's documented command-line path: `xcodebuild archive` and
# `xcodebuild -exportArchive` with an ExportOptions.plist whose method is
# app-store-connect and destination upload, both with -allowProvisioningUpdates
# and the -authenticationKey… options. The build number is this workflow's
# run number, so every upload is newer than the last.
#
# Secrets (repository → Settings → Secrets and variables → Actions), by name.
# Terris has its own API key ("Terris CI"), never Budgeer's:
#   ASC_KEY_ID        the API key's id
#   ASC_ISSUER_ID     the issuer id (Users and Access → Integrations)
#   ASC_KEY_P8        the key file's contents (AuthKey_<id>.p8), BEGIN/END lines included
#   APPLE_TEAM_ID     the developer team id
# The key goes to a file only this job can read and is removed at the end;
# nothing here prints a secret.
#
# The team's certificate slots are shared with Budgeer. This pipeline only
# ever revokes the development certificate its own run created (matched
# against the runner's keychain at the end of the job), never Budgeer's.
name: ios-testflight
on:
  push:
    branches: [main]
    paths: ['Terris/**', 'scripts/asc/**', '.github/workflows/ios-testflight.yml']

permissions:
  contents: read

# One upload at a time; a second run waits rather than cancelling an upload
# half-way.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  PROJECT: Terris/Terris.xcodeproj
  SCHEME: Terris
  DERIVED: Terris/DerivedData

jobs:
  upload:
    # Belt and braces: never upload anything but main.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    # A hung archive would otherwise burn up to six hours of macOS minutes.
    timeout-minutes: 45
    steps:
      - name: Check the secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions). See .claude/project.md, iOS app."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app && xcodebuild -version
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install xcodegen
      - name: Project
        run: cd Terris && xcodegen generate
      - name: The API key and the export options
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          umask 077
          # Rebuild the PEM (a pasted key can lose its line breaks or gain \r):
          # the API scripts tolerate that, xcodebuild doesn't.
          node --input-type=module -e "import { normalisePem } from './scripts/asc/api.mjs'; process.stdout.write(normalisePem(process.env.ASC_KEY_P8))" > "$RUNNER_TEMP/asc_key.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
      - name: Certificate script tests
        run: node --test scripts/asc/certificates.test.mjs
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # Stray spaces or newlines in a pasted secret break xcodebuild's sign-in.
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Terris.xcarchive" -derivedDataPath "$DERIVED" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
          | tee archive.log | grep -E "error:|warning: .*Terris/|ARCHIVE|\*\*"
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Terris.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
          | tee export.log | grep -E "error:|Upload|EXPORT|\*\*"
      # Signing on this fresh machine made a development certificate; revoke
      # exactly that one (matched against this runner's keychain), so runs
      # don't fill the team's slots. Never another pipeline's (the team is
      # shared with Budgeer), never a person's, never a distribution one.
      - name: Revoke this run's development certificate
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          security find-certificate -a -c "Apple Development" -p > "$RUNNER_TEMP/runner-certs.pem" 2>/dev/null || true
          node scripts/asc/certificates.mjs "$RUNNER_TEMP/runner-certs.pem"
          rm -f "$RUNNER_TEMP/runner-certs.pem"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8" "$RUNNER_TEMP/ExportOptions.plist"
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
