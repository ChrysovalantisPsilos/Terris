# XcodeGen spec. Generate the project with `xcodegen generate` in this folder;
# Terris.xcodeproj is generated and never committed.
name: Terris
options:
  bundleIdPrefix: com.chrysovalantis
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "26.5"

settings:
  base:
    DEVELOPMENT_TEAM: Z9KGWP5G82
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Swift 6.2 defaults the Xcode template turned on; the code relies on them.
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Terris:
    type: application
    platform: iOS
    sources:
      - path: Terris
    info:
      # Merged with the generated Info.plist (GENERATE_INFOPLIST_FILE).
      path: Terris/Info.plist
      properties:
        # CloudKit pushes changes from other devices as silent notifications.
        UIBackgroundModes: [remote-notification]
    entitlements:
      path: Terris/Terris.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.chrysovalantis.Terris
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrysovalantis.Terris
        PRODUCT_NAME: Terris
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        INFOPLIST_KEY_CFBundleDisplayName: Terris
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: >-
          Terris reads where your photos were taken to fill in the countries
          you've visited. Your photos never leave your device.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        APS_ENVIRONMENT: development
      configs:
        Release:
          # TestFlight and App Store builds use production push (CloudKit Production).
          APS_ENVIRONMENT: production

  TerrisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TerrisTests
    dependencies:
      - target: Terris
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrysovalantis.TerrisTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Terris.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Terris"
        BUNDLE_LOADER: "$(TEST_HOST)"

  TerrisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TerrisUITests
    dependencies:
      - target: Terris
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrysovalantis.TerrisUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Terris

schemes:
  Terris:
    build:
      targets:
        Terris: all
        TerrisTests: [test]
        TerrisUITests: [test]
    test:
      config: Debug
      targets:
        - TerrisTests
        - TerrisUITests
    archive:
      config: Release
